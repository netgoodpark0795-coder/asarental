# 네이버 블로그 최신 글을 blog.json 으로 저장하고, 바뀌었으면 홈페이지를 다시 만든다
name: 블로그 소식 업데이트

on:
  schedule:
    - cron: '0 0,9 * * *'   # 매일 오전 9시, 오후 6시 (한국 시간)
  workflow_dispatch:         # 깃허브 Actions 화면에서 직접 실행

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 블로그 RSS 읽기
        shell: pwsh
        run: ./scripts/update-blog.ps1

      - name: 바뀌었으면 저장하고 홈페이지 다시 만들기
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- blog.json; then
            echo "새 글 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog.json
          git commit -m "블로그 소식 업데이트"
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
